<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Details - Campus Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Campus Lost & Found
    </div>

    <div class="nav-links">

        <a href="index.html#home">Home</a>
        <a href="index.html#items">Items</a>
        <a href="index.html#post">Post Item</a>

    </div>

</nav>


<section class="item-details-section">

    <div id="itemDetails">

        <p class="loading">
            Loading item details...
        </p>

    </div>

</section>


<footer>

    <p>
        © 2026 Campus Lost & Found App
    </p>

</footer>


<script>

const API_URL =
    "https://campus-lost-and-found-app-1.onrender.com/api";


// ==============================
// LOAD ITEM DETAILS
// ==============================

async function loadItemDetails() {

    const params =
        new URLSearchParams(window.location.search);

    const itemId =
        params.get("id");


    if (!itemId) {

        showError("Invalid item ID.");

        return;
    }


    try {

        const response =
            await fetch(`${API_URL}/items/${itemId}`);

        const data =
            await response.json();


        if (!data.success) {

            showError(data.message);

            return;
        }


        const item =
            data.item;


        // Current logged-in user
        const currentUser =
            JSON.parse(
                localStorage.getItem("user") || "null"
            );


        // Support both id and _id
        const currentUserId =
            currentUser?._id || currentUser?.id;


        // Posted user's ID
        const postedById =
            item.postedBy?._id || item.postedBy?.id;


        // ==============================
        // IMAGE
        // ==============================

        const imageHTML = item.image

            ? `
                <img
                    src="${item.image}"
                    class="details-image"
                    alt="${item.title}"
                >
              `

            : `
                <div class="details-no-image">
                    No Image Available
                </div>
              `;


        // ==============================
        // ACTION BUTTONS
        // ==============================

        let actionButtons = "";


        // ==========================================
        // CLAIM BUTTON
        // Only another user can claim ACTIVE item
        // ==========================================

        if (
            currentUserId &&
            item.status === "active" &&
            postedById !== currentUserId
        ) {

            actionButtons += `
                <button
                    class="claim-btn"
                    onclick="claimItem('${item._id}')">
                    Claim Item
                </button>
            `;
        }


        // ==========================================
        // RETURN BUTTON
        // Owner can return CLAIMED item
        // ==========================================

        if (
            currentUserId &&
            item.status === "claimed" &&
            postedById === currentUserId
        ) {

            actionButtons += `
                <button
                    class="return-btn"
                    onclick="returnItem('${item._id}')">
                    Mark as Returned
                </button>
            `;
        }


        // ==========================================
        // DISPLAY ITEM
        // ==========================================

        document.getElementById("itemDetails").innerHTML = `

            <div class="details-card">

                ${imageHTML}

                <div class="details-content">

                    <span class="badge ${item.type}">
                        ${item.type.toUpperCase()}
                    </span>


                    <h1>
                        ${item.title}
                    </h1>


                    <p class="details-description">
                        ${item.description}
                    </p>


                    <div class="details-info">

                        <p>
                            <strong>Category:</strong>
                            ${item.category}
                        </p>


                        <p>
                            <strong>Location:</strong>
                            ${item.location}
                        </p>


                        <p>
                            <strong>Date:</strong>
                            ${new Date(item.date).toLocaleDateString()}
                        </p>


                        <p>
                            <strong>Status:</strong>
                            ${item.status}
                        </p>


                        <p>
                            <strong>Posted By:</strong>
                            ${item.postedBy?.name || "Student"}
                        </p>


                        ${
                            item.claimedBy
                                ? `
                                    <p>
                                        <strong>Claimed By:</strong>
                                        ${item.claimedBy.name || "Student"}
                                    </p>
                                  `
                                : ""
                        }

                    </div>


                    <div class="item-actions">

                        ${actionButtons}

                    </div>


                    <a
                        href="index.html#items"
                        class="back-btn">
                        ← Back to Items
                    </a>

                </div>

            </div>

        `;

    }

    catch (error) {

        console.error(error);

        showError(
            "Unable to load item. Please make sure backend is running."
        );
    }
}


// ==============================
// SHOW ERROR
// ==============================

function showError(message) {

    document.getElementById("itemDetails").innerHTML = `

        <div class="details-card">

            <div class="details-content">

                <h2>
                    Item Not Found
                </h2>

                <p>
                    ${message}
                </p>

                <a
                    href="index.html#items"
                    class="back-btn">
                    Back to Items
                </a>

            </div>

        </div>

    `;
}


// ==============================
// CLAIM ITEM
// ==============================

async function claimItem(itemId) {

    const token =
        localStorage.getItem("token");


    if (!token) {

        alert("Please login first.");

        return;
    }


    try {

        const response = await fetch(

            `${API_URL}/items/${itemId}/claim`,

            {
                method: "PUT",

                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );


        const data =
            await response.json();


        alert(data.message);


        if (data.success) {

            await loadItemDetails();

        }

    }

    catch (error) {

        console.error(error);

        alert("Unable to claim item.");
    }
}


// ==============================
// RETURN ITEM
// ==============================

async function returnItem(itemId) {

    const token =
        localStorage.getItem("token");


    if (!token) {

        alert("Please login first.");

        return;
    }


    try {

        const response = await fetch(

            `${API_URL}/items/${itemId}/return`,

            {
                method: "PUT",

                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );


        const data =
            await response.json();


        alert(data.message);


        if (data.success) {

            await loadItemDetails();

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to mark item as returned."
        );
    }
}


// ==============================
// START
// ==============================

loadItemDetails();

</script>

</body>

</html>
