<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard - Campus Lost & Found</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .stat h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .stat p {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            margin-bottom: 18px;
        }

        .items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .no-image {
            height: 190px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }

        .card-content {
            padding: 18px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            margin: 7px 0;
            color: #555;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .claimed {
            background: #fef3c7;
            color: #92400e;
        }

        .returned {
            background: #dbeafe;
            color: #1e40af;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 10px;
            color: #666;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                margin-left: 8px;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>Campus Lost & Found</h2>

    <div>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="welcome">
        <h1>My Dashboard</h1>
        <p id="welcomeText">Loading...</p>
    </div>

    <div class="stats">

        <div class="stat">
            <h3>My Posted Items</h3>
            <p id="postedCount">0</p>
        </div>

        <div class="stat">
            <h3>My Claims</h3>
            <p id="claimCount">0</p>
        </div>

        <div class="stat">
            <h3>Returned Items</h3>
            <p id="returnedCount">0</p>
        </div>

    </div>

    <div class="section">
        <h2>My Posted Items</h2>
        <div id="postedItems" class="items"></div>
    </div>

    <div class="section">
        <h2>My Claims</h2>
        <div id="claimedItems" class="items"></div>
    </div>

</div>

<script>

const API_URL = "http://localhost:5000/api/items";

const token = localStorage.getItem("token");

let currentUser = null;

try {
    currentUser = JSON.parse(localStorage.getItem("user"));
} catch (error) {
    currentUser = null;
}

if (!token || !currentUser) {

    alert("Please login first.");

    window.location.href = "index.html";

}

document.getElementById("welcomeText").textContent =
    `Welcome, ${currentUser.name}!`;

async function loadDashboard() {

    try {

        const response = await fetch(API_URL);

        const data = await response.json();

        if (!data.success) {
            throw new Error("Unable to load items");
        }

        const items = data.items || [];

        const myId = String(
            currentUser.id || currentUser._id
        );

        const postedItems = items.filter(item => {

            const postedId =
                item.postedBy?._id ||
                item.postedBy;

            return String(postedId) === myId;

        });

        const claimedItems = items.filter(item => {

            const claimedId =
                item.claimedBy?._id ||
                item.claimedBy;

            return String(claimedId) === myId;

        });

        const returnedItems = postedItems.filter(
            item => item.status === "returned"
        );

        document.getElementById("postedCount").textContent =
            postedItems.length;

        document.getElementById("claimCount").textContent =
            claimedItems.length;

        document.getElementById("returnedCount").textContent =
            returnedItems.length;

        displayItems(
            postedItems,
            "postedItems",
            "No items posted by you yet."
        );

        displayItems(
            claimedItems,
            "claimedItems",
            "You have not claimed any items yet."
        );

    } catch (error) {

        console.error(error);

        document.getElementById("postedItems").innerHTML =
            `<div class="empty">Unable to load dashboard.</div>`;

    }

}

function displayItems(items, elementId, emptyMessage) {

    const container = document.getElementById(elementId);

    if (items.length === 0) {

        container.innerHTML =
            `<div class="empty">${emptyMessage}</div>`;

        return;
    }

    container.innerHTML = items.map(item => {

        const imageHTML = item.image
            ? `<img src="${item.image}" alt="${item.title}">`
            : `<div class="no-image">No Image</div>`;

        return `

            <div class="card">

                ${imageHTML}

                <div class="card-content">

                    <h3>${item.title}</h3>

                    <p>
                        <strong>Type:</strong>
                        ${item.type}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${item.category}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${item.location}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${new Date(item.date).toLocaleDateString()}
                    </p>

                    <span class="status ${item.status}">
                        ${item.status.toUpperCase()}
                    </span>

                </div>

            </div>

        `;

    }).join("");

}
function logout() {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "index.html";
}
loadDashboard();

</script>

</body>
</html>
